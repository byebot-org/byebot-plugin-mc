# ByeBot Server Settings
# In "local" mode, edit this file to configure ByeBot.
# In "byebot" mode, this file is auto-generated from the API — manual edits will be overwritten.
#
# Change settings-mode in config.yml to switch between modes.

server:
  # Your ByeBot server ID — found in your ByeBot dashboard.
  # Required for attack-mode verification QR codes.
  id: ""
  name: "My Server"

firewall:
  # Block connections from known datacenter/VPS IP ranges.
  # Ranges are fetched from the ByeBot API (requires api-token).
  block-aws: true
  block-google: true
  block-ovh: true
  block-hetzner: true
  block-digitalocean: true
  block-azure: true

regions:
  # "block" = only block the listed countries
  # "allow" = only allow the listed countries (block everyone else)
  mode: "block"
  countries: []
  #  - "RU"
  #  - "CN"

advanced:
  # Rate limiting — block IPs that join too frequently
  rate-limit-enabled: true
  rate-limit-max-joins-per-minute: 30
  rate-limit-ban-duration-seconds: 300

  # Username entropy checks (detects random bot names)
  name-entropy-enabled: false
  name-entropy-min-score: 2
  name-block-numeric-only: false
  name-block-repeated-chars: false
  name-block-sequential: false
  name-min-length: 3
  name-max-length: 16

  # Proxy/VPN detection (requires api-token)
  proxy-block-vpn: false
  proxy-block-tor: false
  proxy-block-residential: false

  # Ping flood protection
  ping-flood-enabled: false
  ping-max-per-minute: 60
  ping-ban-duration-seconds: 60

lists:
  # IPs in the whitelist always bypass all checks.
  whitelist: []
  #  - "1.2.3.4"

  # IPs in the blacklist are always blocked.
  blacklist: []
  #  - "5.6.7.8"

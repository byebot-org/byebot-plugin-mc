# ByeBot — English language file
# Uses MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Placeholders use {key} syntax.

prefix: "<dark_gray>[<aqua>ByeBot</aqua>]</dark_gray> "

general:
  no-permission: "<red>You don't have permission to do that."
  reload-not-implemented: "<yellow>Reload is not yet implemented."
  checking-updates: "<gray>Checking for updates..."

command:
  version: "<aqua>ByeBot</aqua> <dark_aqua>v{version}</dark_aqua>"
  help-header: "<aqua>ByeBot</aqua> <dark_aqua>v{version}</dark_aqua>"
  help-version: "  <yellow>/bb version<reset> <gray>— Plugin version"
  help-reload:  "  <yellow>/bb reload<reset>  <gray>— Reload config <dark_gray>(byebot.reload)"
  help-check:   "  <yellow>/bb check<reset>   <gray>— Check for updates <dark_gray>(byebot.admin)"

antibot:
  block-rate-limit: "<red>Too many connection attempts from your IP. Please try again later."
  block-datacenter: "<red>Connections from datacenter IPs are not allowed on this server."
  block-blacklisted: "<red>Your IP has been blacklisted from this server."
  block-attack-mode: "<red>This server is under attack. Please try again later."

attack-mode:
  verification-required: "<red><bold>⚠ Verification Required</bold></red>"
  scan-instructions: "<gray>Scan the QR code below to verify you are human:"
  verify-link: "<yellow>{url}"
  reconnect-note: "<gray>After verifying, reconnect to this server."
